name: AION Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Node version
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
