name: Vercel Deployment Check

on:
  deployment_status: {}

permissions:
  contents: read
  issues: write
  deployments: read

concurrency:
  group: vercel-deployment-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  track-deployment:
    name: Track Vercel deployment
    runs-on: ubuntu-latest

    steps:
      - name: Create or update deployment failure issue
        if: github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error'
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = context.payload.deployment;
            const status = context.payload.deployment_status;
            const environment = deployment.environment || 'unknown';
            const commit = deployment.sha || 'unknown';
            const targetUrl = status.target_url || deployment.target_url || '';
            const logUrl = status.log_url || deployment.log_url || '';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const environmentMarker = `- **Environment:** ${environment}`;
            const existing = issues.find((issue) =>
              issue.title.startsWith('🚨 Vercel deployment failed:') &&
              issue.body?.includes(environmentMarker)
            );

            const title = `🚨 Vercel deployment failed: ${commit.slice(0, 7)}`;
            const body = [
              '## Vercel deployment failed',
              '',
              `- **Environment:** ${environment}`,
              `- **State:** ${status.state}`,
              `- **Commit:** ${commit}`,
              `- **Deployment:** ${targetUrl || 'Not provided'}`,
              `- **Logs:** ${logUrl || 'Not provided'}`,
              '',
              'This issue tracks the current Vercel deployment failure.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close deployment failure issue after success
        if: github.event.deployment_status.state == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = context.payload.deployment;
            const environment = deployment.environment || 'unknown';
            const environmentMarker = `- **Environment:** ${environment}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const deploymentIssues = issues.filter((issue) =>
              issue.title.startsWith('🚨 Vercel deployment failed:') &&
              issue.body?.includes(environmentMarker)
            );

            for (const issue of deploymentIssues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Report tracker result
        run: echo "Vercel deployment status tracked: ${{ github.event.deployment_status.state }}"
